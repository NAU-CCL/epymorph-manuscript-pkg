[project]
name = "manuscript-analysis"
version = "1"
description = "Executable analysis for the epymorph 2.0 manuscript: the two case studies and the software-landscape search."
requires-python = ">=3.12,<3.13"
dependencies = [
    "epymorph==2.0.0b1",
    "ipykernel==7.3.0",
    "joblib==1.6.0",
    "jupyterlab==4.6.4",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
    "openpyxl==3.1.5",
    "papermill==2.7.0",
    "scipy==1.17.1",
]

[dependency-groups]
dev = [
    "ruff==0.16.8",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv]
exclude-newer = "7 days" # supply chain attack mitigation
